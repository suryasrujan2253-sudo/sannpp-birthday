<!DOCTYPE html>
<html>
<head>
<title>Happy Birthday Sannpp ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  background:#0f0f1a;
  color:white;
  font-family:Arial, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  text-align:center;
  overflow:hidden;
}
.container{
  z-index:2;
  padding:20px;
}
button{
  margin:10px;
  padding:12px 25px;
  border:none;
  border-radius:25px;
  background:#ff4e8a;
  color:white;
  font-size:16px;
  cursor:pointer;
  box-shadow:0 0 15px #ff4e8a;
}
button:hover{
  transform:scale(1.05);
}
.glow{
  font-size:28px;
  font-weight:bold;
  text-shadow:0 0 10px pink,0 0 20px red,0 0 30px purple;
}

/* Floating hearts */
.heart{
  position:absolute;
  color:#ff4e8a;
  font-size:20px;
  animation:float 6s linear infinite;
}
@keyframes float{
  0%{transform:translateY(100vh);opacity:1;}
  100%{transform:translateY(-10vh);opacity:0;}
}

/* Fireworks */
.firework{
  position:absolute;
  width:6px;
  height:6px;
  background:yellow;
  border-radius:50%;
  animation:explode 1.2s ease-out forwards;
}
@keyframes explode{
  0%{transform:scale(1);opacity:1;}
  100%{transform:scale(25);opacity:0;}
}
</style>
</head>
<body>

<audio id="bgmusic" src="love.mp3" loop></audio>

<div class="container">
<h2>Hi My Sannpp ❤️</h2>
<p>Tonight is special ✨</p>
<button onclick="start()">Start Surprise 💖</button>
</div>

<script>
let textSpeed = 40;

function typeEffect(element, text, i = 0){
  if(i < text.length){
    element.innerHTML += text.charAt(i);
    setTimeout(()=> typeEffect(element, text, i+1), textSpeed);
  }
}

function start(){
  document.getElementById("bgmusic").play();
  document.body.innerHTML = `
    <div class="container">
      <h1 class="glow" id="typing"></h1>
      <button onclick="page2()">Next 💞</button>
    </div>`;
  typeEffect(document.getElementById("typing"), "Happy Birthday My Beautiful Sannpp 🎂❤️");
}

function page2(){
  document.body.innerHTML=`
    <div class="container">
      <h2>You make me smile even on my worst days 😊</h2>
      <p>You are my peace, my happiness, my everything 💕</p>
      <button onclick="page3()">Next 💗</button>
    </div>`;
}

function page3(){
  document.body.innerHTML=`
    <div class="container">
      <h2>Every moment with you feels magical ✨</h2>
      <p>Being your first love is the greatest gift of my life 💖</p>
      <button onclick="page4()">Next 💓</button>
    </div>`;
}

function page4(){
  document.body.innerHTML=`
    <div class="container">
      <h2>I promise to protect you, support you, and love you always 🤍</h2>
      <p>No matter what life brings, I am yours ♾️</p>
      <button onclick="final()">One Last Thing 💍</button>
    </div>`;
}

function final(){
  document.body.innerHTML=`
    <div class="container">
      <h1 class="glow">Happy Birthday Sannpp 🎂❤️</h1>
      <h2 class="glow">I Love You So Much 💖</h2>
      <p>You make my life beautiful every single day 🌸</p>
      <p>Will you stay with me forever? 💍</p>
      <p style="margin-top:20px;font-size:18px;">Forever Yours,<br><b>Mungeesa</b></p>
    </div>`;
  createHearts();
  createFireworks();
}

function createHearts(){
  for(let i=0;i<30;i++){
    let heart=document.createElement("div");
    heart.className="heart";
    heart.innerHTML="❤️";
    heart.style.left=Math.random()*100+"vw";
    heart.style.animationDuration=(4+Math.random()*4)+"s";
    document.body.appendChild(heart);
  }
}

function createFireworks(){
  for(let i=0;i<25;i++){
    let fire=document.createElement("div");
    fire.className="firework";
    fire.style.left=Math.random()*100+"vw";
    fire.style.top=Math.random()*100+"vh";
    document.body.appendChild(fire);
  }
}
</script>

</body>
</html>
