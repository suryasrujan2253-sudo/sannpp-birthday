<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Sannpp ❤️</title>
<style>
body {
  margin:0;
  font-family: Georgia, serif;
  overflow:hidden;
  background: linear-gradient(135deg, #ffe6f0 0%, #ffd9e8 50%, #ffcce0 100%);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  text-align:center;
  color:#4d0033;
}
.container { max-width:90%; padding:20px; }
.message { font-size:28px; font-weight:bold; line-height:1.4; text-shadow:0 0 5px #ff99cc,0 0 10px #ff6699; }
/* Hearts & fireworks same as before */
.heart, .bgheart { position:absolute; color:#ff6699; font-size:20px; animation:float 8s linear infinite; }
@keyframes float{ 0%{transform:translateY(100vh) scale(0.5);opacity:0.5;} 50%{opacity:0.7;} 100%{transform:translateY(-10vh) scale(1);opacity:0;} }
.spark{position:absolute;width:4px;height:4px;border-radius:50%;opacity:1;}
</style>
</head>
<body>
<audio id="bgmusic" src="love.mp3" loop></audio>
<div class="container">
  <div class="message" id="message">Tap anywhere to start 💖</div>
</div>

<script>
let currentSlide=-1, typing=false;
const messages=[
  "Happy Birthday My Beautiful Sannpp 🎂❤️",
  "You make me smile even on my worst days 😊\nYou are my peace, my happiness, my everything 💕",
  "Every moment with you feels magical ✨",
  "I promise to protect you, support you, and love you always 🤍\nNo matter what life brings, I am yours ♾️",
  "You are my sunshine on cloudy days 🌸\nMy heart beats for you every second ❤️",
  "With you, every day feels like a dream ✨\nBeing yours is the happiest feeling 💕",
  "Happy Birthday Sannpp 🎂❤️\nI Love You So Much 💖\nYou make my life beautiful every single day 🌸\nForever Yours,\nMungeesa"
];

function typeEffect(el,text,callback){
  typing=true; el.innerHTML="";
  let lines=text.split("\n"), lineIndex=0;
  function typeLine(){
    if(lineIndex>=lines.length){typing=false; if(callback)callback(); return;}
    let line=lines[lineIndex], charIndex=0;
    function typeChar(){
      if(charIndex<line.length){el.innerHTML+=line.charAt(charIndex); charIndex++; setTimeout(typeChar,40);}
      else{el.innerHTML+="<br>"; lineIndex++; typeLine();}
    } typeChar();
  } typeLine();
}

function createHearts(){for(let i=0;i<35;i++){let h=document.createElement("div");h.className="heart";h.innerHTML="❤️";h.style.left=Math.random()*100+"vw";h.style.animationDuration=(4+Math.random()*4)+"s";document.body.appendChild(h);}}
function createFireworks(){const c=["#ff4e8a","#ff99cc","#ffe6f0","#ffb3d9","#ffffff"];for(let i=0;i<30;i++){let s=document.createElement("div");s.className="spark";s.style.background=c[Math.floor(Math.random()*c.length)];s.style.left=Math.random()*100+"vw";s.style.top=Math.random()*100+"vh";document.body.appendChild(s);let a=Math.random()*2*Math.PI,d=50+Math.random()*100,x=0,y=0;let id=setInterval(()=>{x+=Math.cos(a)*2;y+=Math.sin(a)*2;s.style.transform=`translate(${x}px,${y}px) scale(${1-(Math.abs(x)+Math.abs(y))/d})`;s.style.opacity=1-(Math.abs(x)+Math.abs(y))/d;if(Math.abs(x)+Math.abs(y)>d){s.remove();clearInterval(id);}},16);}}

function nextSlide(){
  if(typing)return; currentSlide++;
  const el=document.getElementById("message");
  if(currentSlide===0) document.getElementById("bgmusic").play().catch(()=>{});
  if(currentSlide<messages.length){
    typeEffect(el,messages[currentSlide],()=>{
      if(currentSlide===messages.length-1){createHearts(); createFireworks();}
    });
  }
}

document.body.addEventListener("click",()=>{nextSlide();});
</script>
</body>
</html>
