body{
  margin:0;
  background: radial-gradient(ellipse at bottom, #0f0f1a 0%, #1a1a2e 100%);
  overflow:hidden;
  color:white;
  font-family:Arial, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  text-align:center;
}
.container{
  z-index:2;
  padding:20px;
}
button{
  margin:10px;
  padding:12px 25px;
  border:none;
  border-radius:25px;
  background:#ff4e8a;
  color:white;
  font-size:18px;
  cursor:pointer;
  box-shadow:0 0 15px #ff4e8a;
}
button:hover{
  transform:scale(1.05);
}
.glow{
  font-size:28px;
  font-weight:bold;
  text-shadow:0 0 10px pink,0 0 20px red,0 0 30px purple;
}
/* Stars */
.star{
  position:absolute;
  width:2px;
  height:2px;
  background:white;
  border-radius:50%;
  animation:twinkle 3s infinite;
}
@keyframes twinkle{
  0%,100%{opacity:0.2;}
  50%{opacity:1;}
}
/* Hearts */

  font-size:20px;
  animation:float 6s linear infinite;
}
