<!DOCTYPE html>
<html>
<head>
<title>Happy Birthday Sannpp ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
  margin:0;
  background: radial-gradient(ellipse at bottom, #0f0f1a 0%, #1a1a2e 100%);
  overflow:hidden;
  color:white;
  font-family:Arial, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  text-align:center;
}

/* Stars */
.star{
  position:absolute;
  width:2px;
  height:2px;
  background:white;
  border-radius:50%;
  animation:twinkle 3s infinite;
}
@keyframes twinkle{
  0%,100%{opacity:0.2;}
  50%{opacity:1;}
}

.container{
  z-index:2;
  padding:20px;
}

button{
  margin:10px;
  padding:12px 25px;
  border:none;
  border-radius:25px;
  background:#ff4e8a;
  color:white;
  font-size:16px;
  cursor:pointer;
  box-shadow:0 0 15px #ff4e8a;
}
button:hover{
  transform:scale(1.05);
}

.glow{
  font-size:28px;
  font-weight:bold;
  text-shadow:0 0 10px pink,0 0 20px red,0 0 30px purple;
}

/* Hearts */
.heart{
  position:absolute;
  color:#ff4e8a;
  font-size:20px;
  animation:float 6s linear infinite;
}
@keyframes float{
  0%{transform:translateY(100vh);opacity:1;}
  100%{transform:translateY(-10vh);opacity:0;}
}

/* Fireworks sparks */
.spark{
  position:absolute;
  width:4px;
  height:4px;
  border-radius:50%;
  opacity:1;
}
</style>
</head>
<body>

<audio id="bgmusic" src="love.mp3" loop></audio>

<div class="container">
<h2>Hi My Sannpp ❤️</h2>
<p>Tonight is special ✨</p>
<button onclick="start()">Start Surprise 💖</button>
</div>

<script>
let textSpeed = 40;

/* Create stars in background */
for(let i=0;i<120;i++){
  let star=document.createElement("div");
  star.className="star";
  star.style.left=Math.random()*100+"vw";
  star.style.top=Math.random()*100+"vh";
  star.style.width=star.style.height=(Math.random()*2+1)+"px";
  star.style.animationDuration=(2+Math.random()*3)+"s";
  document.body.appendChild(star);
}

/* Typing effect */
function typeEffect(element, text, i = 0){
  if(i < text.length){
    element.innerHTML += text.charAt(i);
    setTimeout(()=> typeEffect(element, text, i+1), textSpeed);
  }
}

/* Start surprise */
function start(){
  document.getElementById("bgmusic").play();
  document.body.innerHTML=`
    <div class="container">
      <h1 class="glow" id="typing"></h1>
      <button onclick="page2()">Next 💞</button>
    </div>`;
  typeEffect(document.getElementById("typing"), "Happy Birthday My Beautiful Sannpp 🎂❤️");
}

/* Romantic pages */
function page2(){
  document.body.innerHTML=`
    <div class="container">
      <h2>You make me smile even on my worst days 😊</h2>
      <p>You are my peace, my happiness, my everything 💕</p>
      <button onclick="page3()">Next 💗</button>
    </div>`;
}

function page3(){
  document.body.innerHTML=`
    <div class="container">
      <h2>Every moment with you feels magical ✨</h2>
      <p>Being your first love is the greatest gift of my life 💖</p>
      <button onclick="page4()">Next 💓</button>
    </div>`;
}

function page4(){
  document.body.innerHTML=`
    <div class="container">
      <h2>I promise to protect you, support you, and love you always 🤍</h2>
      <p>No matter what life brings, I am yours ♾️</p>
      <button onclick="final()">One Last Thing 💍</button>
    </div>`;
}

/* Final cinematic screen */
function final(){
  document.body.innerHTML=`
    <div class="container">
      <h1 class="glow">Happy Birthday Sannpp 🎂❤️</h1>
      <h2 class="glow">I Love You So Much 💖</h2>
      <p>You make my life beautiful every single day 🌸</p>
      <p>Will you stay with me forever? 💍</p>
      <p style="margin-top:20px;font-size:18px;">Forever Yours,<br><b>Mungeesa</b></p>
    </div>`;
  createHearts();
  createFireworks();
}

/* Floating hearts */
function createHearts(){
  for(let i=0;i<35;i++){
    let heart=document.createElement("div");
    heart.className="heart";
    heart.innerHTML="❤️";
    heart.style.left=Math.random()*100+"vw";
    heart.style.animationDuration=(4+Math.random()*4)+"s";
    document.body.appendChild(heart);
  }
}

/* Fireworks with colored sparks */
function createFireworks(){
  let colors=["#ff4e8a","#ffdc73","#9affff","#ff7b00","#ffffff"];
  for(let i=0;i<30;i++){
    let spark=document.createElement("div");
    spark.className="spark";
    spark.style.background=colors[Math.floor(Math.random()*colors.length)];
    spark.style.left=Math.random()*100+"vw";
    spark.style.top=Math.random()*100+"vh";
    document.body.appendChild(spark);

    /* Animate spark movement */
    let angle=Math.random()*2*Math.PI;
    let distance=50+Math.random()*100;
    let x=0, y=0;
    let id=setInterval(()=>{
      x+=Math.cos(angle)*2;
      y+=Math.sin(angle)*2;
      spark.style.transform=`translate(${x}px, ${y}px) scale(${1-(Math.abs(x)+Math.abs(y))/distance})`;
      spark.style.opacity=1-(Math.abs(x)+Math.abs(y))/distance;
      if(Math.abs(x)+Math.abs(y)>distance) {spark.remove(); clearInterval(id);}
    },16);
  }
}
</script>
</body>
</html>
